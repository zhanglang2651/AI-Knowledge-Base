# Nginx 反向代理配置示例（生产部署）
#
# 核心注意点：SSE 必须关闭代理缓冲（proxy_buffering off），
# 否则 Nginx 会攒够缓冲区大小才转发，前端看到的将是「一次性刷出整段答案」
# 而不是逐字输出 —— 这是流式接口上线后最常见的翻车点。

upstream kb_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name kb.example.com;

    # 前端构建产物（npm run build 生成的 kb-web/dist）
    root /usr/share/nginx/html;
    index index.html;

    # 前端静态资源：带 hash 的文件可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 单页应用路由回退：/kb/1 这类前端路由刷新时不能 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE 流式接口：单独配置，必须关闭缓冲
    location /api/v1/chat/stream {
        proxy_pass http://kb_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';

        # 关键三行
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 长回答可能持续数分钟，超时不能按默认 60s
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # 告诉上游不要压缩，压缩会破坏流式分块
        proxy_set_header Accept-Encoding '';
    }

    # 其余接口
    location /api/ {
        proxy_pass http://kb_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';

        # 文档上传：放宽请求体大小限制
        client_max_body_size 50m;
        proxy_read_timeout 120s;
    }

    location /actuator/health {
        proxy_pass http://kb_backend;
        access_log off;
    }
}
